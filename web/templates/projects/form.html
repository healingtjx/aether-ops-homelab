{{define "project_edit_form"}}
<div class="modal-header"><h2>编辑项目</h2><button class="modal-close" onclick="closeModal()">&times;</button></div>
<form hx-put="/projects/{{.Project.ID}}" hx-swap="none"
      hx-on::after-request="
        if(event.detail.successful) {
          var row = document.getElementById('project-{{.Project.ID}}');
          if(row) row.outerHTML = event.detail.xhr.responseText;
          closeModal();
        } else if(event.detail.xhr) {
          document.getElementById('modal-container').innerHTML = event.detail.xhr.responseText;
        }">
    <div class="field">
        <label>名称</label>
        <input type="text" name="name" value="{{.Project.Name}}" required maxlength="255">
    </div>
    <div class="field">
        <label>描述</label>
        <input type="text" name="description" value="{{or "" .Project.Description}}">
    </div>
    {{if .Error}}<div id="modal-error"><span class="error">{{.Error}}</span></div>{{else}}<div id="modal-error"></div>{{end}}
    <div class="modal-actions">
        <button type="button" onclick="closeModal()">取消</button>
        <button type="submit" class="primary">保存</button>
    </div>
</form>
{{end}}
