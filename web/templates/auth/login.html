{{define "login_page"}}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AetherOps - 登录</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8f9fa; color: #212529; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); padding: 2.5rem; width: 360px; }
        .login-card h1 { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.25rem; text-align: center; }
        .login-card .subtitle { font-size: 0.85rem; color: #868e96; text-align: center; margin-bottom: 1.75rem; }
        .field { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
        .field label { font-size: 0.8rem; font-weight: 600; color: #495057; }
        input { padding: 0.5rem 0.75rem; border: 1px solid #ced4da; border-radius: 4px; font-size: 0.875rem; width: 100%; font-family: inherit; }
        input:focus { outline: none; border-color: #0066cc; box-shadow: 0 0 0 2px rgba(0,102,204,0.15); }
        .error-msg { background: #fff5f5; color: #c92a2a; border: 1px solid #ffc9c9; border-radius: 4px; padding: 0.5rem 0.75rem; font-size: 0.85rem; margin-bottom: 1rem; text-align: center; }
        button { width: 100%; padding: 0.6rem; cursor: pointer; border: none; border-radius: 4px; background: #0066cc; color: #fff; font-size: 0.9rem; font-weight: 600; transition: background 0.15s; }
        button:hover { background: #0052a3; }
    </style>
</head>
<body>
<div class="login-card">
    <h1>AetherOps</h1>
    <div class="subtitle">运维管理平台</div>
    {{if .Error}}<div class="error-msg">{{.Error}}</div>{{end}}
    <form method="POST" action="{{.LoginPath}}">
        <div class="field">
            <label for="username">用户名</label>
            <input type="text" id="username" name="username" autofocus required>
        </div>
        <div class="field">
            <label for="password">密码</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">登 录</button>
    </form>
</div>
</body>
</html>
{{end}}
